server {
    listen 443 ssl http2;
    server_name smatrix.example.com;

    ssl_certificate /etc/letsencrypt/live/smatrix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smatrix.example.com/privkey.pem;

    root /opt/sing-matrix/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18088/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/traffic/ws {
        proxy_pass http://127.0.0.1:18088/api/v1/traffic/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
